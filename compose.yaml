services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: trivia_game
      POSTGRES_PASSWORD: trivia_game
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia_game"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
